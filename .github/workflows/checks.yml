# Every check that needs no real backend (scripts/check-all.sh): gateway lint and race
# tests, control tests and lint, the cross-half end-to-end test.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-all:
    runs-on: ubuntu-24.04
    # A hang ends here, not at the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          # The gateway has no dependencies (no go.sum to key a cache on).
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: control/package-lock.json
      - name: check-all
        run: scripts/check-all.sh
        env:
          GOFLAGS: -count=1
